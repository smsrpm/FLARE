<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FLARE</title>
  <!-- Home-screen launcher for the FLARE Streamlit app.
       Streamlit serves its own HTML (and icon), so this page supplies the FLARE Buddy icon and
       app name for "Add to Home Screen" and shows the app inside a full-window frame. -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="FLARE">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#26262A">
  <style>
    html, body { margin: 0; height: 100%; background: #26262A; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0;
             padding: env(safe-area-inset-top) env(safe-area-inset-right)
                      env(safe-area-inset-bottom) env(safe-area-inset-left);
             box-sizing: border-box; background: #fff; }
    noscript a { color: #fff; font: 16px system-ui, sans-serif; }
  </style>
</head>
<body>
  <!-- If the Streamlit app moves, change both addresses below. -->
  <iframe id="app" title="FLARE" allow="fullscreen; clipboard-write" allowfullscreen
          src="https://flare-pwr.streamlit.app/?embed=true"></iframe>
  <noscript><a href="https://flare-pwr.streamlit.app/">Open FLARE</a></noscript>
</body>
</html>
